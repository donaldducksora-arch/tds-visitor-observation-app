<section id="startView"><div class="card"><h2>調査を始める</h2><p class="sub">設定はこの端末に保存され、記録に自動で付きます。</p><div class="field"><label>調査日</label><input id="date" type="date"></div><div class="row"><div class="field"><label>観察者ID</label><input id="observer" placeholder="例：A"></div><div class="field"><label>グループID</label><input id="group" placeholder="例：G01"></div></div><div class="field"><label>調査条件</label><select id="condition"><option value="app">アプリ利用</option><option value="paper">紙媒体利用</option></select></div><button class="primary wide" id="startBtn">調査を開始</button></div><div class="note">記録は端末内に自動保存されます。観察者の推測ではなく、行動との関係を確認できたきっかけだけを選択してください。</div></section>

const key='tds-observer-v1';let db=JSON.parse(localStorage.getItem(key)||'null')||{facilities:[],sessions:[],active:null,records:[]};if(!db.facilities.length)db.facilities=seed.map((x,i)=>({id:'F'+String(i+1).padStart(3,'0'),category:'アトラクション',name:x[0],type:x[1],ports:[ports[x[2]]],status:x[3]||'要確認'}));db.facilities.forEach(f=>{if(!f.category)f.category=f.type==='レストラン'?'レストラン':f.type==='ショップ'?'ショップ':f.type==='ショー'?'ショー・パレード':'アトラクション'});extraRows.forEach((x,i)=>{let id='M'+String(i+1).padStart(3,'0');if(!db.facilities.some(f=>f.id===id))db.facilities.push({id,category:x[0],name:x[1],type:x[2],ports:x[3].split(',').map(n=>ports[+n]),status:'要確認'})});function save(){localStorage.setItem(key,JSON.stringify(db))}let catNow='',facilityNow=null,triggerNow=new Set(),resultNow='';const $=x=>document.getElementById(x);function show(id){['startView','homeView','captureView','endView','manageView'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),1800)}function active(){return db.sessions.find(x=>x.id===db.active)}function fmt(s){return new Date(s).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}function makeId(){return crypto.randomUUID?crypto.randomUUID():'r'+Date.now()+Math.random().toString(16).slice(2)}function renderHome(){let s=active();if(!s){show('startView');return} $('conditionBadge').textContent=s.condition==='app'?'アプリ利用':'紙媒体利用';$('sessionSummary').textContent=`${s.observer}・${s.group}　${s.date}`;$('elapsed').textContent=`開始 ${fmt(s.startedAt)}　/　記録 ${db.records.filter(r=>r.session_id===s.id).length}件`;$('actions').innerHTML=cats.map(c=>`<button class="action" data-cat="${c}">${c}<span>タップして記録</span></button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>openCapture(b.dataset.cat));renderRecords();show('homeView')};function renderRecords(target='records'){let s=active() function openCapture(c){catNow=c;facilityNow=null;triggerNow=new Set;resultNow='';$('catLabel').textContent=c;$('search').value='';$('note').value='';let routeMode=c==='休憩・その他';$('facilityBlock').classList.toggle('hidden',routeMode);$('areaMoveBlock').classList.toggle('hidden',!routeMode);if(routeMode){let opts='<option value="">エリアを選択</option>'+ports.map(p=>`<option>${p}</option>`).join('');$('fromArea').innerHTML=opts;$('toArea').innerHTML=opts}$('triggers').innerHTML=triggers.map(t=>`<button class="chip" data-trigger="${t}">${t}</button>`).join('');$('results').innerHTML=results[c].map(t=>`<button class="chip" data-result="${t}">${t}</button>`).join('');document.querySelectorAll('[data-trigger]').forEach(b=>b.onclick=()=>{if(triggerNow.has(b.dataset.trigger)){triggerNow.delete(b.dataset.trigger);b.classList.remove('selected')}else{triggerNow.add(b.dataset.trigger);b.classList.add('selected')}});document.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-result]').forEach(z=>z.classList.remove('selected'));b.classList.add('selected');resultNow=b.dataset.result});renderFacilities();show('captureView')}
function renderFacilities(){let q=$('search').value.trim().toLowerCase();let recent=JSON.parse(localStorage.getItem('tds-recent')||'[]');let fs=db.facilities.filter(f=>(!q||f.name.toLowerCase().includes(q)||f.ports.some(p=>p.toLowerCase().includes(q)))&&f.category===catNow);fs.sort((a,b)=>{let ai=recent.indexOf(a.id),bi=recent.indexOf(b.id);return(ai<0?999:ai)-(bi<0?999:bi)});$('facilityList').innerHTML=fs.map(f=>`<button class="facility ${facilityNow===f.id?'selected':''}" data-fac="${f.id}">${f.name}<small>${f.ports.join('・')}｜${f.type}｜${f.status}</small></button>`).join('')||'<span class="sub">該当施設なし。施設管理から追加できます。</span>';document.querySelectorAll('[data-fac]').forEach(b=>b.onclick=()=>{facilityNow=b.dataset.fac;renderFacilities()})}
$('search').oninput=renderFacilities;$('backBtn').onclick=renderHome;$('saveBtn').onclick=()=>{let routeMode=catNow==='休憩・その他';if(!routeMode&&!facilityNow){toast('施設を選択してください');return}let s=active(),from=routeMode?$('fromArea').value:'',to=routeMode?$('toArea').value:'',f=routeMode?null:db.facilities.find(x=>x.id===facilityNow),now=new Date().toISOString();if(routeMode&&(!from||!to)){toast('移動前と移動後のエリアを選択してください');return}db.records.push({record_id:makeId(),session_id:s.id,observer_id:s.observer,group_id:s.group,condition:s.condition,timestamp:now,action_category:catNow,facility_id:f?.id||'',facility_name:routeMode?from+' → '+to:f.name,theme_port:routeMode?[from,to]:f.ports,facility_type:routeMode?'エリア間移動':f.type,from_area:from,to_area:to,trigger:[...triggerNow],action_result:resultNow||'',note:$('note').value.trim(),record_mode:'通常記録',created_at:now});if(f){let recent=JSON.parse(localStorage.getItem('tds-recent')||'[]');localStorage.setItem('tds-recent',JSON.stringify([f.id,...recent.filter(id=>id!==f.id)].slice(0,6)))}save();renderHome();toast('保存しました')};
$('startBtn').onclick=()=>{let observer=$('observer').value.trim(),group=$('group').value.trim();if(!observer||!group){toast('観察者IDとグループIDを入力してください');return}let now=new Date().toISOString(),s={id:makeId(),date:$('date').value,observer,group,condition:$('condition').value,startedAt:now,endedAt:''};db.sessions.push(s);db.active=s.id;save();renderHome()};$('date').value=new Date().toLocaleDateString('en-CA');$('undoBtn').onclick=()=>{let s=active(),idx=db.records.map((r,i)=>r.session_id===s.id?i:-1).filter(i=>i>=0).pop();if(idx==null){toast('取り消せる記録がありません');return}db.records.splice(idx,1);save();renderHome();toast('直前の記録を取り消しました')};$('endBtn').onclick=()=>{let s=active();s.endedAt=new Date().toISOString();db.active=null;save();renderEnd(s)};function duration(a,b){let sec=Math.max(0,Math.floor((new Date(b)-new Date(a))/1000));return `${Math.floor(sec/3600)}時間${Math.floor(sec%3600/60)}分`};function renderEnd(s){let rs=db.records.filter(r=>r.session_id===s.id);$('endSummary').textContent=`${s.date} · ${s.observer} · ${s.group} · ${s.condition==='app'?'アプリ利用':'紙媒体利用'} · ${fmt(s.startedAt)}〜${fmt(s.endedAt)}`;$('durationStat').textContent=duration(s.startedAt,s.endedAt);$('totalStat').textContent=rs.length;renderRecords('endRecords');show('endView')};$('resumeBtn').onclick=()=>{let last=db.sessions.at(-1);if(last){db.active=last.id;save();renderHome()}};$('newSessionBtn').onclick=()=>{show('startView')};function exportData(kind){let s=db.sessions.at(-1),rs=db.records.filter(r=>r.session_id===s.id),payload={session:s,records:rs,facility_master:db.facilities};let blob;if(kind==='json')blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});else{let cols=['record_id','session_id','observer_id','group_id','condition','timestamp','action_category','facility_id','facility_name','theme_port','facility_type','from_area','to_area','trigger','action_result','note','record_mode','created_at'];let esc=v=>'"'+String(Array.isArray(v)?v.join('|'):v??'').replaceAll('"','""')+'"';let rows=[cols.join(','),...rs.map(r=>cols.map(c=>esc(r[c])).join(','))];let master='\n\n施設マスター\nfacility_id,facility_category,facility_name,theme_port,facility_type,status\n'+db.facilities.map(f=>[f.id,f.category,f.name,f.ports.join('|'),f.type,f.status].map(esc).join(',')).join('\n');blob=new Blob(['\ufeff'+rows.join('\n')+master],{type:'text/csv;charset=utf-8'})}let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`tds_${s.date}_${s.observer}_${s.group}.${kind==='json'?'json':'csv'}`;a.click();URL.revokeObjectURL(a.href)}$('csvBtn').onclick=()=>exportData('csv');$('jsonBtn').onclick=()=>exportData('json');
$('manageBtn').onclick=()=>{renderManage();show('manageView')};$('manageBack').onclick=renderHome;$('newPort').innerHTML=ports.map(p=>`<option>${p}</option>`).join('');$('newCategory').innerHTML=cats.map(c=>`<option>${c}</option>`).join('');$('fromArea').innerHTML='<option value="">エリアを選択</option>'+ports.map(p=>`<option>${p}</option>`).join('');$('toArea').innerHTML='<option value="">エリアを選択</option>'+ports.map(p=>`<option>${p}</option>`).join('');function renderManage(){$('masterList').innerHTML=db.facilities.map(f=>`<div class="record"><strong>${f.name}</strong><small>${f.category} · ${f.ports.join('・')} · ${f.type} · <select data-status="${f.id}"><option ${f.status==='要確認'?'selected':''}>要確認</option><option ${f.status==='営業中'?'selected':''}>営業中</option><option ${f.status==='休止中'?'selected':''}>休止中</option><option ${f.status==='終了'?'selected':''}>終了</option></select></small></div>`).join('');document.querySelectorAll('[data-status]').forEach(x=>x.onchange=()=>{db.facilities.find(f=>f.id===x.dataset.status).status=x.value;save()})};$('addFacility').onclick=()=>{let name=$('newName').value.trim(),type=$('newType').value.trim();if(!name||!type){toast('施設名と種類を入力してください');return}if(db.facilities.some(f=>f.name===name)){toast('同じ名前の施設があります');return}db.facilities.push({id:'U'+makeId(),category:$('newCategory').value,name,type,ports:[$('newPort').value],status:'要確認'});save();$('newName').value='';$('newType').value='';renderManage();toast('施設を追加しました')};
